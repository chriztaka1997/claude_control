# Claude Control's own tmux server (-L claude-control). ~/.tmux.conf never loads here.
# No prefix: every key goes to Claude. The app handles switching and closing.
set -g prefix None
set -g prefix2 None
unbind C-b
set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g default-terminal 'tmux-256color'
